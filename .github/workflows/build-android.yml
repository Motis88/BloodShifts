name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BloodShift-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-${{ github.sha }}
          name: BloodShift Android Debug APK (${{ steps.date.outputs.date }})
          body: |
            קובץ התקנה לאנדרואיד – גרסת Debug (Android Debug APK)

            ⚠️ זוהי גרסת debug לצורכי בדיקה בלבד, לא גרסת ייצור חתומה.

            להתקנה:
            1. הורד את קובץ ה-APK למכשיר האנדרואיד שלך
            2. אפשר התקנה ממקורות לא ידועים בהגדרות המכשיר
            3. פתח את הקובץ והתקן את האפליקציה

            Commit: ${{ github.sha }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
